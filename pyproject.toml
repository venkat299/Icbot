[project]
name = "icbot"
version = "0.1.0"
description = "ai interview system"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langgraph>=0.2.0",
    "pydantic>=2.7.0",
    "tenacity>=8.2.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "fpdf2>=2.7.8",
    "fpdf>=1.7.2",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["icbot_backend*", "candidate_service*"]
